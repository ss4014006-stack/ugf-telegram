name: Build UI Fighter Telegram

on:
  workflow_dispatch:
    inputs:
      mic_gain:
        description: "Mic gain multiplier (1 = normal, 4 = loud, 10 = very loud)"
        default: "4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout this repo (for tiger.jpg)
        uses: actions/checkout@v4

      - name: Checkout official Telegram source (latest)
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          submodules: recursive
          path: tg

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/system-images /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch Telegram (keys, mic boost, name, tiger icon)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          cat > /tmp/patch.py <<'PYEOF'
          #!/usr/bin/env python3
          """UI FIGHTER patcher for DrKLO/Telegram source. Usage: patch.py <tg_dir> <gain> <icon_path_or_empty>"""
          import os, re, sys, glob

          tg, gain, icon = sys.argv[1], float(sys.argv[2]), sys.argv[3]
          app_id, app_hash = os.environ.get("TG_API_ID", ""), os.environ.get("TG_API_HASH", "")
          NAME = "UI Fighter"

          def read(p):
              with open(p, encoding="utf-8", errors="surrogateescape") as f: return f.read()
          def write(p, s):
              with open(p, "w", encoding="utf-8", errors="surrogateescape") as f: f.write(s)

          # ---------- 1. API keys ----------
          if not (app_id.strip().isdigit() and len(app_hash.strip()) == 32):
              sys.exit("ERROR: Secrets TG_API_ID / TG_API_HASH missing or wrong (hash 32 chars). Get them from my.telegram.org")
          bv = glob.glob(f"{tg}/**/BuildVars.java", recursive=True)
          if not bv: sys.exit("ERROR: BuildVars.java not found")
          s = read(bv[0])
          s, n1 = re.subn(r"(APP_ID\s*=\s*)\d+", r"\g<1>" + app_id.strip(), s)
          s, n2 = re.subn(r'(APP_HASH\s*=\s*)"[^"]*"', r'\g<1>"' + app_hash.strip() + '"', s)
          write(bv[0], s)
          print(f"[keys] BuildVars patched ({n1},{n2})")

          # ---------- 2. Gain class ----------
          java = '''package org.telegram.messenger;

          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;

          /** UI FIGHTER mic amplifier: gain + soft limiter (tanh). Never throws. */
          public class UgfGain {
              public static final float GAIN = %sf;

              private static short amp(short s) {
                  float x = (s / 32768f) * GAIN;
                  return (short) (Math.tanh(x) * 32000f);
              }

              public static void process(ByteBuffer buf, int bytes) {
                  try {
                      if (buf == null || bytes < 2) return;
                      ByteBuffer b = buf.duplicate().order(ByteOrder.LITTLE_ENDIAN);
                      int n = Math.min(bytes, b.capacity()) & ~1;
                      for (int i = 0; i < n; i += 2) b.putShort(i, amp(b.getShort(i)));
                  } catch (Throwable ignore) {}
              }

              public static void process(byte[] a, int bytes) {
                  try {
                      if (a == null || bytes < 2) return;
                      int n = Math.min(bytes, a.length) & ~1;
                      for (int i = 0; i < n; i += 2) {
                          short s = (short) ((a[i] & 0xff) | (a[i + 1] << 8));
                          s = amp(s);
                          a[i] = (byte) (s & 0xff);
                          a[i + 1] = (byte) ((s >> 8) & 0xff);
                      }
                  } catch (Throwable ignore) {}
              }

              public static void process(short[] a, int samples) {
                  try {
                      if (a == null || samples < 1) return;
                      int n = Math.min(samples, a.length);
                      for (int i = 0; i < n; i++) a[i] = amp(a[i]);
                  } catch (Throwable ignore) {}
              }
          }
          ''' % repr(gain)
          src_roots = glob.glob(f"{tg}/TMessagesProj/src/main/java/org/telegram/messenger")
          if not src_roots: sys.exit("ERROR: org/telegram/messenger dir not found")
          write(os.path.join(src_roots[0], "UgfGain.java"), java)

          # ---------- 3. Hook every AudioRecord.read(...) ----------
          pat = re.compile(r"((?:int\s+)?(\w+)\s*=\s*(\w*(?:[aA]udioRecord|recorder)\w*)\.read\(\s*([A-Za-z_][\w\.]*)\s*,[^;]*;)")
          hits = []
          for p in glob.glob(f"{tg}/**/*.java", recursive=True):
              t = read(p)
              if "audiorecord" not in t.lower() or "UgfGain" in t: continue
              def rep(m):
                  stmt, var, _, arg = m.groups()
                  hits.append((p, stmt))
                  return f"{stmt} if ({var} > 0) org.telegram.messenger.UgfGain.process({arg}, {var});"
              t2 = pat.sub(rep, t)
              if t2 != t: write(p, t2)
          for p, l in hits: print(f"[hook] {os.path.relpath(p, tg)} :: {l}")
          if not hits: sys.exit("ERROR: no AudioRecord.read(...) found, hook failed (Telegram source changed). Send this log to Claude.")

          # ---------- 4. App name ----------
          cnt = 0
          for p in glob.glob(f"{tg}/**/res/values/*.xml", recursive=True):
              t = read(p)
              t2 = re.sub(r'(<string\s+name="(?:AppName|app_name|AppNameBeta)"[^>]*>)[^<]*(</string>)', r"\g<1>" + NAME + r"\g<2>", t)
              if t2 != t: write(p, t2); cnt += 1
          print(f"[name] {cnt} files renamed to {NAME}")

          # ---------- 5. Icon (manifest-driven, exact names only) ----------
          if icon and os.path.isfile(icon):
              from PIL import Image, ImageDraw
              img = Image.open(icon).convert("RGBA")
              w, h = img.size; m = min(w, h)
              img = img.crop(((w-m)//2, (h-m)//2, (w-m)//2+m, (h-m)//2+m))
              dens = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              done = 0
              manifests = [x for x in glob.glob(f"{tg}/**/AndroidManifest.xml", recursive=True) if "/build/" not in x]
              for mf in manifests:
                  mt = read(mf); am = re.search(r"<application\b[^>]*>", mt, re.S)
                  if not am: continue
                  refs = re.findall(r'android:(icon|roundIcon)="@(mipmap|drawable)/(\w+)"', am.group(0))
                  if not refs: continue
                  res = os.path.join(os.path.dirname(mf), "res")
                  for kind, typ, name in refs:
                      for d in glob.glob(f"{tg}/**/res/{typ}*", recursive=True):
                          for f in glob.glob(os.path.join(d, "*")):
                              if os.path.splitext(os.path.basename(f))[0] == name and "/build/" not in f: os.remove(f)
                      for k, sz in dens.items():
                          d = f"{res}/{typ}-{k}"; os.makedirs(d, exist_ok=True)
                          sq = img.resize((sz, sz), Image.LANCZOS)
                          if kind == "roundIcon" or name.endswith("round"):
                              mask = Image.new("L", (sz, sz), 0); ImageDraw.Draw(mask).ellipse((0, 0, sz-1, sz-1), fill=255)
                              rd = Image.new("RGBA", (sz, sz), (0, 0, 0, 0)); rd.paste(sq, (0, 0), mask); rd.save(f"{d}/{name}.png")
                          else:
                              sq.save(f"{d}/{name}.png")
                      print(f"[icon] {typ}/{name} replaced in {res}"); done += 1
              if not done: print("[icon] manifest has no icon refs - icon unchanged")
          else:
              print("[icon] tiger.jpg not found - icon unchanged")

          # ---------- 6. gradle memory ----------
          gp = os.path.join(tg, "gradle.properties")
          t = read(gp) if os.path.exists(gp) else ""
          t = re.sub(r"(?m)^org\.gradle\.jvmargs=.*$\n?", "", t)
          write(gp, t.rstrip("\n") + "\norg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\n")

          # ---------- 7. aapt2 fix: multiple non-positional format args ----------
          SPEC = re.compile(r"%(?:(\d+)\$)?[-#+0,(]*\d*(?:\.\d+)?[sdfxXeEgGcb]")
          fixed = {"renum": 0, "mixed": 0}
          def renum(text):
              t = text.replace("%%", "\0\0")
              specs = list(SPEC.finditer(t))
              nonpos = [m for m in specs if not m.group(1)]
              if len(nonpos) < 2: return None
              if len(nonpos) != len(specs): return "mixed"
              out, last = [], 0
              for i, m in enumerate(specs, 1):
                  out.append(t[last:m.start()]); out.append("%" + str(i) + "$" + m.group(0)[1:]); last = m.end()
              out.append(t[last:])
              return "".join(out).replace("\0\0", "%%")
          def fix_string(m):
              head, body, tail = m.groups()
              if "formatted=" in head: return m.group(0)
              r = renum(body)
              if r is None: return m.group(0)
              if r == "mixed":
                  fixed["mixed"] += 1
                  return head[:-1] + ' formatted="false">' + body + tail
              fixed["renum"] += 1
              return head + r + tail
          def fix_item(m):
              head, body, tail = m.groups()
              r = renum(body)
              if r is None or r == "mixed": return m.group(0)
              fixed["renum"] += 1
              return head + r + tail
          RS = re.compile(r"(<string\b[^>]*?(?<!/)>)(.*?)(</string>)", re.S)
          RI = re.compile(r"(<item\b[^>]*?(?<!/)>)(.*?)(</item>)", re.S)
          nfiles = 0
          for p in glob.glob(f"{tg}/**/src/main/res/values*/*.xml", recursive=True):
              t = read(p)
              if "%" not in t: continue
              t2 = RI.sub(fix_item, RS.sub(fix_string, t))
              if t2 != t: write(p, t2); nfiles += 1
          print(f"[aapt2] fixed {fixed['renum']} strings (renumbered), {fixed['mixed']} marked formatted=false, in {nfiles} files")

          # ---------- 8. only arm64 (faster build, fits all modern phones) ----------
          LST = r'["\'][\w-]+["\'](?:\s*,\s*["\'][\w-]+["\'])*'
          abi_re = re.compile(r'(\babiFilters\b\s*(?:=\s*)?)(' + LST + r')')
          inc_re = re.compile(r'(\binclude\s+)(' + LST + r')')
          cnt_abi = 0
          for p in glob.glob(f"{tg}/**/*.gradle", recursive=True):
              if "/build/" in p: continue
              t = read(p); out = []
              for l in t.split("\n"):
                  l2 = abi_re.sub(lambda m: m.group(1) + '"arm64-v8a"' if "arm" in m.group(2) else m.group(0), l)
                  if "arm" in l2 and "v7a" in l2: l2 = inc_re.sub(lambda m: m.group(1) + '"arm64-v8a"' if "arm" in m.group(2) else m.group(0), l2)
                  if l2 != l: cnt_abi += 1; print(f"[abi] {os.path.relpath(p, tg)}: {l.strip()[:90]} -> {l2.strip()[:90]}")
                  out.append(l2)
              t2 = "\n".join(out)
              if t2 != t: write(p, t2)
          print(f"[abi] {cnt_abi} lines restricted to arm64-v8a")
          print("[done] all patches complete")
          PYEOF
          (python3 -c "import PIL" 2>/dev/null || (sudo apt-get update -qq; sudo apt-get install -y python3-pil)) && python3 /tmp/patch.py tg "${{ github.event.inputs.mic_gain }}" "$GITHUB_WORKSPACE/tiger.jpg"

      - name: Install Android NDK / SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          NDK=$(grep -rhoE 'ndkVersion[ =]+"?[0-9.]+' tg --include=build.gradle* | head -1 | grep -oE '[0-9.]+$' || true)
          echo "NDK wanted: $NDK"
          if [ -n "$NDK" ]; then sdkmanager "ndk;$NDK" || true; fi
          sdkmanager "cmake;3.22.1" || true

      - name: Setup ccache (reuse C++ compile on retries)
        run: |
          sudo apt-get install -y ccache >/dev/null 2>&1 && {
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
            echo "ccache enabled"
          } || echo "ccache not available, continuing without"

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ugf-cache-${{ github.run_id }}
          restore-keys: |
            ugf-cache-

      - name: Build APK
        shell: bash
        working-directory: tg
        run: |
          chmod +x gradlew
          TASKS=$(./gradlew :TMessagesProj_App:tasks --all --no-daemon -q 2>/dev/null | grep -oiE "^assemble[A-Za-z0-9_]*Debug" || true)
          echo "$TASKS"
          TASK=$(echo "$TASKS" | grep -iE "afat" | head -1)
          if [ -z "$TASK" ]; then TASK=$(echo "$TASKS" | head -1); fi
          echo "BUILDING: $TASK"
          ./gradlew ":TMessagesProj_App:$TASK" --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          find . -name "*.apk" -path "*outputs*"

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ugf-cache-${{ github.run_id }}

      - name: Short error summary (also on Summary page)
        if: failure()
        shell: bash
        run: |
          {
            echo "## SHORT ERROR SUMMARY"
            echo '```'
            grep -n -E "What went wrong|error:|Execution failed|Could not|AAPT|cannot find symbol|incompatible types|FAILED" build.log | grep -v -i "warning" | cut -c1-230 | head -40 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find tg -name "*.apk" -path "*outputs*" | grep -i -E "arm64|afat|universal" | head -1)
          [ -z "$APK" ] && APK=$(find tg -name "*.apk" -path "*outputs*" | head -1)
          echo "APK=$APK"
          cp "$APK" out/UI-Fighter-Telegram.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UI-Fighter-Telegram
          path: out/UI-Fighter-Telegram.apk

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ugf-${{ github.run_number }}" out/UI-Fighter-Telegram.apk \
            --title "UI Fighter build ${{ github.run_number }}" \
            --notes "Official Telegram source + UI Fighter mic boost (gain ${{ github.event.inputs.mic_gain }})"
