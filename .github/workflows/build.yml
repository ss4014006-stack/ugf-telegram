                  setContentView(scroll);
              }

              private Button presetButton(String name, final int[] values) {
                  Button b = new Button(this);
                  b.setText(name);
                  b.setTextSize(11);
                  b.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          applyPreset(values);
                      }
                  });
                  return b;
              }

              private void applyPreset(int[] values) {
                  busy = true;
                  SharedPreferences.Editor e = sp.edit();
                  for (int i = 0; i < 9; i++) {
                      e.putInt(UgfGain.KEYS[i], values[i]);
                      bars[i].setProgress(values[i] - UgfGain.MIN[i]);
                      vals[i].setText(String.valueOf(values[i]));
                  }
                  e.apply();
                  busy = false;
                  UgfGain.reload();
              }
          }
          '''

          src_roots = glob.glob(f"{tg}/TMessagesProj/src/main/java/org/telegram/messenger")
          if not src_roots: sys.exit("ERROR: org/telegram/messenger dir not found")
          write(os.path.join(src_roots[0], "UgfGain.java"), JAVA_GAIN)
          write(os.path.join(src_roots[0], "UgfMixerActivity.java"), JAVA_MIXER)
          print("[dsp] UgfGain.java + UgfMixerActivity.java written")

          # register the mixer screen as its own launcher icon
          ACT = """
                  <activity android:name="org.telegram.messenger.UgfMixerActivity"
                      android:exported="true"
                      android:label="UI Fighter Mixer"
                      android:icon="@mipmap/ic_launcher"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          """
          mfs = [m for m in glob.glob(f"{tg}/**/AndroidManifest.xml", recursive=True) if "/build/" not in m]
          pref = [m for m in mfs if m.endswith("TMessagesProj/src/main/AndroidManifest.xml")] + mfs
          placed = None
          for mf in pref:
              t = read(mf)
              if "</application>" in t and "<application" in t:
                  if "UgfMixerActivity" not in t:
                      i = t.rindex("</application>")
                      write(mf, t[:i] + ACT + "    " + t[i:])
                  placed = mf
                  break
          if not placed: sys.exit("ERROR: no AndroidManifest.xml with <application> found")
          print(f"[mixer] launcher activity registered in {os.path.relpath(placed, tg)}")

          # ---------- 3. Hook every AudioRecord.read(...) ----------
          pat = re.compile(r"((?:int\s+)?(\w+)\s*=\s*(\w*[aA]udioRecord\w*)\.read\(\s*([A-Za-z_][\w\.]*)\s*,[^;]*;)")
          hits = []
          for p in glob.glob(f"{tg}/**/*.java", recursive=True):
              t = read(p)
              if "audiorecord" not in t.lower() or "UgfGain" in t: continue
              def rep(m):
                  stmt, var, recv, arg = m.groups()
                  hits.append((p, stmt))
                  return f"{stmt} if ({var} > 0) org.telegram.messenger.UgfGain.process({arg}, {var}, {recv});"
              t2 = pat.sub(rep, t)
              if t2 != t: write(p, t2)
          for p, l in hits: print(f"[hook] {os.path.relpath(p, tg)} :: {l}")
          if not hits: sys.exit("ERROR: no AudioRecord.read(...) found, hook failed (Telegram source changed). Send this log to Claude.")

          # ---------- 4. App name ----------
          cnt = 0
          for p in glob.glob(f"{tg}/**/res/values/*.xml", recursive=True):
              t = read(p)
              t2 = re.sub(r'(<string\s+name="(?:AppName|app_name|AppNameBeta)"[^>]*>)[^<]*(</string>)', r"\g<1>" + NAME + r"\g<2>", t)
              if t2 != t: write(p, t2); cnt += 1
          print(f"[name] {cnt} files renamed to {NAME}")

          # ---------- 5. Icon: replace IN PLACE (same res root as each original) ----------
          def app_icon_names():
              names = {"ic_launcher", "ic_launcher_round"}
              for mf in glob.glob(f"{tg}/**/AndroidManifest.xml", recursive=True):
                  if "/build/" in mf: continue
                  am = re.search(r"<application\b[^>]*>", read(mf), re.S)
                  if am:
                      for _, typ, nm in re.findall(r'android:(icon|roundIcon)="@(mipmap|drawable)/(\w+)"', am.group(0)): names.add(nm)
              return names
          if icon and os.path.isfile(icon):
              from PIL import Image, ImageDraw
              img = Image.open(icon).convert("RGBA")
              w, h = img.size; m = min(w, h)
              img = img.crop(((w-m)//2, (h-m)//2, (w-m)//2+m, (h-m)//2+m))
              dens = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              targets = app_icon_names()
              found = {}   # (res_root, typ, stem) -> [files]
              for f in glob.glob(f"{tg}/**/res/*/*", recursive=True):
                  if "/build/" in f: continue
                  d = os.path.basename(os.path.dirname(f)); stem = os.path.splitext(os.path.basename(f))[0]
                  typ = "mipmap" if d.startswith("mipmap") else ("drawable" if d.startswith("drawable") else None)
                  if typ and stem in targets:
                      found.setdefault((f.split("/res/")[0] + "/res", typ, stem), []).append(f)
              for (root, typ, stem), files in sorted(found.items()):
                  for f in files: os.remove(f)
                  for k, sz in dens.items():
                      d = f"{root}/{typ}-{k}"; os.makedirs(d, exist_ok=True)
                      sq = img.resize((sz, sz), Image.LANCZOS)
                      if stem.endswith("round"):
                          mask = Image.new("L", (sz, sz), 0); ImageDraw.Draw(mask).ellipse((0, 0, sz-1, sz-1), fill=255)
                          rd = Image.new("RGBA", (sz, sz), (0, 0, 0, 0)); rd.paste(sq, (0, 0), mask); rd.save(f"{d}/{stem}.png")
                      else:
                          sq.save(f"{d}/{stem}.png")
                  print(f"[icon] {typ}/{stem} replaced in place at {os.path.relpath(root, tg)} ({len(files)} old files)")
              if not found: print("[icon] no ic_launcher files found - icon unchanged")
          else:
              print("[icon] tiger.jpg not found - icon unchanged")

          # ---------- 5c. sanity: every launcher icon the manifests ask for must still exist ----------
          have = set()
          for f in glob.glob(f"{tg}/**/res/*/*", recursive=True):
              if "/build/" not in f and os.path.basename(os.path.dirname(f)).startswith(("mipmap", "drawable")):
                  have.add(os.path.splitext(os.path.basename(f))[0])
          need = set()
          for mf in glob.glob(f"{tg}/**/AndroidManifest.xml", recursive=True):
              if "/build/" in mf: continue
              need |= set(re.findall(r'@(?:mipmap|drawable)/(ic_launcher\w*)', read(mf)))
          missing = sorted(need - have)
          if missing: sys.exit("ERROR: icon resources missing after patch: " + ", ".join(missing))
          print(f"[check] icon resources OK: {sorted(need)}")

          # ---------- 6. gradle memory ----------
          gp = os.path.join(tg, "gradle.properties")
          t = read(gp) if os.path.exists(gp) else ""
          t = re.sub(r"(?m)^org\.gradle\.jvmargs=.*$\n?", "", t)
          write(gp, t.rstrip("\n") + "\norg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\n")

          # ---------- 7. aapt2 fix: multiple non-positional format args ----------
          SPEC = re.compile(r"%(?:(\d+)\$)?[-#+0,(]*\d*(?:\.\d+)?[sdfxXeEgGcb]")
          fixed = {"renum": 0, "mixed": 0}
          def renum(text):
              t = text.replace("%%", "\0\0")
              specs = list(SPEC.finditer(t))
              nonpos = [m for m in specs if not m.group(1)]
              if len(nonpos) < 2: return None
              if len(nonpos) != len(specs): return "mixed"
              out, last = [], 0
              for i, m in enumerate(specs, 1):
                  out.append(t[last:m.start()]); out.append("%" + str(i) + "$" + m.group(0)[1:]); last = m.end()
              out.append(t[last:])
              return "".join(out).replace("\0\0", "%%")
          def fix_string(m):
              head, body, tail = m.groups()
              if "formatted=" in head: return m.group(0)
              r = renum(body)
              if r is None: return m.group(0)
              if r == "mixed":
                  fixed["mixed"] += 1
                  return head[:-1] + ' formatted="false">' + body + tail
              fixed["renum"] += 1
              return head + r + tail
          def fix_item(m):
              head, body, tail = m.groups()
              r = renum(body)
              if r is None or r == "mixed": return m.group(0)
              fixed["renum"] += 1
              return head + r + tail
          RS = re.compile(r"(<string\b[^>]*?(?<!/)>)(.*?)(</string>)", re.S)
          RI = re.compile(r"(<item\b[^>]*?(?<!/)>)(.*?)(</item>)", re.S)
          nfiles = 0
          for p in glob.glob(f"{tg}/**/src/main/res/values*/*.xml", recursive=True):
              t = read(p)
              if "%" not in t: continue
              t2 = RI.sub(fix_item, RS.sub(fix_string, t))
              if t2 != t: write(p, t2); nfiles += 1
          print(f"[aapt2] fixed {fixed['renum']} strings (renumbered), {fixed['mixed']} marked formatted=false, in {nfiles} files")

          # ---------- 8. only arm64 (faster build, fits all modern phones) ----------
          LST = r'["\'][\w-]+["\'](?:\s*,\s*["\'][\w-]+["\'])*'
          abi_re = re.compile(r'(\babiFilters\b\s*(?:=\s*)?)(' + LST + r')')
          inc_re = re.compile(r'(\binclude\s+)(' + LST + r')')
          cnt_abi = 0
          for p in glob.glob(f"{tg}/**/*.gradle", recursive=True):
              if "/build/" in p: continue
              t = read(p); out = []
              for l in t.split("\n"):
                  l2 = abi_re.sub(lambda m: m.group(1) + '"arm64-v8a"' if "arm" in m.group(2) else m.group(0), l)
                  if "arm" in l2 and "v7a" in l2: l2 = inc_re.sub(lambda m: m.group(1) + '"arm64-v8a"' if "arm" in m.group(2) else m.group(0), l2)
                  if l2 != l: cnt_abi += 1; print(f"[abi] {os.path.relpath(p, tg)}: {l.strip()[:90]} -> {l2.strip()[:90]}")
                  out.append(l2)
              t2 = "\n".join(out)
              if t2 != t: write(p, t2)
          print(f"[abi] {cnt_abi} lines restricted to arm64-v8a")
          print("[done] all patches complete")
          PYEOF
          (python3 -c "import PIL" 2>/dev/null || (sudo apt-get update -qq; sudo apt-get install -y python3-pil)) && python3 /tmp/patch.py tg 1 "$GITHUB_WORKSPACE/tiger.jpg"

      - name: Install Android NDK / SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          NDK=$(grep -rhoE 'ndkVersion[ =]+"?[0-9.]+' tg --include=build.gradle* | head -1 | grep -oE '[0-9.]+$' || true)
          echo "NDK wanted: $NDK"
          if [ -n "$NDK" ]; then sdkmanager "ndk;$NDK" || true; fi
          sdkmanager "cmake;3.22.1" || true

      - name: Setup ccache (reuse C++ compile on retries)
        run: |
          sudo apt-get install -y ccache >/dev/null 2>&1 && {
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
            echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
            echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
            echo "ccache enabled"
          } || echo "ccache not available, continuing without"

      - name: Restore caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ugf-cache-${{ github.run_id }}
          restore-keys: |
            ugf-cache-

      - name: Build APK
        shell: bash
        working-directory: tg
        run: |
          chmod +x gradlew
          TASKS=$(./gradlew :TMessagesProj_App:tasks --all --no-daemon -q 2>/dev/null | grep -oiE "^assemble[A-Za-z0-9_]*Debug" || true)
          echo "$TASKS"
          TASK=$(echo "$TASKS" | grep -iE "afat" | head -1)
          if [ -z "$TASK" ]; then TASK=$(echo "$TASKS" | head -1); fi
          echo "BUILDING: $TASK"
          VARIANT="${TASK#assemble}"
          echo "=== QUICK CHECK (resources + java compile) - fails fast if something is wrong ==="
          ./gradlew ":TMessagesProj_App:process${VARIANT}Resources" ":TMessagesProj:compileDebugJavaWithJavac" --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "=== QUICK CHECK PASSED - now the full build ==="
          ./gradlew ":TMessagesProj_App:$TASK" --no-daemon --console=plain 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          find . -name "*.apk" -path "*outputs*"

      - name: Save caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ugf-cache-${{ github.run_id }}

      - name: Short error summary (also on Summary page)
        if: failure()
        shell: bash
        run: |
          {
            echo "## SHORT ERROR SUMMARY"
            echo '```'
            grep -n -E "What went wrong|error:|Execution failed|Could not|AAPT|cannot find symbol|incompatible types|FAILED" build.log | grep -v -i "warning" | cut -c1-230 | head -40 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find tg -name "*.apk" -path "*outputs*" | grep -i -E "arm64|afat|universal" | head -1)
          [ -z "$APK" ] && APK=$(find tg -name "*.apk" -path "*outputs*" | head -1)
          echo "APK=$APK"
          cp "$APK" out/UI-Fighter-Telegram.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UI-Fighter-Telegram
          path: out/UI-Fighter-Telegram.apk

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
